name: Build Meta ads APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        run: |
          unzip -o Meta_ads_Android_Project_Custom_Logo_Exact.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meta-ads-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
